name: validate

on:
  workflow_call:
    inputs:
      python_version:
        required: true
        type: string
      minimum_python_version:
        required: true
        type: string

concurrency:
  group: validate-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install Python Packages
      run: |
        pip install -r .github/workflows/requirements/validate/requirements.txt
    # Validate that the code can be run on all the Python versions supported by Spack
    - name: vermin
      run: |
        vermin --backport importlib \
               --backport argparse \
               --violations \
               --backport typing \
               -t=${{ inputs.minimum_python_version }}- \
               -vvv \
               --exclude-regex lib/spack/spack/vendor \
               lib/spack/spack/ lib/spack/llnl/ bin/ var/spack/test_repos
    # Check that __slots__ are used properly
    - name: slotscheck
      run: |
        ./bin/spack python -m slotscheck --exclude-modules="spack.test|spack.vendor" lib/spack/spack/
