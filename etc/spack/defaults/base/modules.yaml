# -------------------------------------------------------------------------
# This is the default configuration for Spack's module file generation.
#
# Settings here are versioned with Spack and are intended to provide
# sensible defaults out of the box. Spack maintainers should edit this
# file to keep it current.
#
# Users can override these settings by defining their
# own instance of this config (see https://spack.readthedocs.io/en/latest/configuration.html).
# -------------------------------------------------------------------------
modules:
  # This maps paths in the package install prefix to environment variables
  # they should be added to. For example, <prefix>/bin should be in PATH.
  prefix_inspections:
    ./bin:
      - PATH
    ./man:
      - MANPATH
    ./share/man:
      - MANPATH
    ./share/aclocal:
      - ACLOCAL_PATH
    ./lib/pkgconfig:
      - PKG_CONFIG_PATH
    ./lib64/pkgconfig:
      - PKG_CONFIG_PATH
    ./share/pkgconfig:
      - PKG_CONFIG_PATH
    ./:
      - CMAKE_PREFIX_PATH

  # These are configurations for the module set named "default"
  default:
    # Where to install modules
    # If set to a non-default value, this setting has precedence.
    # This default value tells spack to:
    # * Prefer $data_home/<module-type> (e.g. $data_home/lmod)
    # * The old module locations are $share/spack/<module-type>: Spack will use
    #   this old location if the new location is empty and the old one isn't
    roots:
     tcl:    $modules_base/modules
     lmod:   $modules_base/lmod
    # What type of modules to use ("tcl" and/or "lmod")
    enable: []

    tcl:
      all:
        autoload: direct

    # Default configurations if lmod is enabled
    lmod:
      all:
        autoload: direct
      hierarchy:
        - mpi
