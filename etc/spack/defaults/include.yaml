include:
  # default platform-specific configuration
  - path: "${platform}"
    optional: true

  # Layout scheme: chooses old (data lives under $spack) or xdg (data lives
  # under ~/.local/share/spack etc.). Earlier entries override later ones,
  # so the scheme can supersede `base` for paths that diverge between
  # layouts. See lib/spack/docs/where_spack_writes_data.rst.
  - name: old-layout
    path: old
    when: 'layout_detected("old")'
    optional: true

  - name: xdg-layout
    path: xdg
    when: 'not layout_detected("old")'
    optional: true

  # base config (lowest priority among defaults)
  - path: base
