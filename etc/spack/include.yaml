include:
  # old layout configuration (pre-1.2 style paths)
  - name: "old-layout"
    path: "$spack/etc/spack/old-layout"
    optional: true
    when: 'old_layout_detected()'

  # XDG layout configuration (1.2+ style paths)
  - name: "xdg-layout"
    path: "$spack/etc/spack/xdg-layout"
    optional: true
    when: 'not old_layout_detected()'

  # user configuration scope
  - name: "user"
    path_override_env_var: SPACK_USER_CONFIG_PATH
    path: "~/.config/spack/"
    backwards_compat: "~/.spack/"
    optional: true
    prefer_modify: true
    when: '"SPACK_DISABLE_LOCAL_CONFIG" not in env'

  # site configuration scope
  - name: "site"
    path: "$spack/etc/spack/site"
    optional: true

  # system configuration scope
  - name: "system"
    path_override_env_var: SPACK_SYSTEM_CONFIG_PATH
    path: "/etc/spack"
    optional: true
    when: '"SPACK_DISABLE_LOCAL_CONFIG" not in env'
