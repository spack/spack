packages:
  llvm:
    externals:
    - spec: llvm@16.0.6+clang~flang+lld~lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang-16
          cxx: /usr/bin/clang++-16
    - spec: llvm@17.0.6+clang~flang+lld~lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang-17
          cxx: /usr/bin/clang++-17
    - spec: llvm@18.1.3+clang~flang+lld+lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  gcc:
    externals:
    - spec: gcc@12.3.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-12
          cxx: /usr/bin/g++-12
          fortran: /usr/bin/gfortran-12
    - spec: gcc@13.3.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-14
          cxx: /usr/bin/g++-14
          fortran: /usr/bin/gfortran-14
