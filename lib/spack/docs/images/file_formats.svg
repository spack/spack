<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 350">
<style>
text{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
font-size:12px;
}
.t{
font-weight:700;
font-size:14px;
text-anchor:middle;
fill:#fff;
}
.s{
font-family:SFMono-Regular,Menlo,Consolas,Monaco,LiberationMono,LucidaConsole,monospace;
font-size:11px;
text-anchor:middle;
fill:#fff;
}
.a{
fill:#7f8c8d;
font-size:11px;
}
.e{
stroke:#7f8c8d;
stroke-width:2;
fill:none;
marker-end:url(#h);
}
</style>
<defs>
<marker id="h" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M0 0L10 5L0 10z" fill="#7f8c8d"/>
</marker>
</defs>

<rect width="530" height="50" x="25" y="20" fill="#e67e22" rx="5"/>
<text x="290" y="41" class="t">Build cache layout</text>
<text x="290" y="59" class="s">v3/manifests/, blobs/</text>

<rect width="170" height="50" x="25" y="150" fill="#3498db" rx="5"/>
<text x="110" y="171" class="t">Database</text>
<text x="110" y="189" class="s">database.version</text>

<rect width="170" height="50" x="575" y="150" fill="#27ae60" rx="5"/>
<text x="660" y="171" class="t">Lockfile</text>
<text x="660" y="189" class="s">_meta.lockfile-version</text>

<rect width="720" height="50" x="25" y="280" fill="#e74c3c" rx="5"/>
<text x="385" y="301" class="t">Spec file</text>
<text x="385" y="319" class="s">spec._meta.version</text>

<!-- a build cache stores its index in the Database format, and its specs as spec files -->
<path class="e" d="M110 70v78"/>
<text x="118" y="106" class="a">index, with</text>
<text x="118" y="120" class="a">media type db.vN</text>
<path class="e" d="M385 70v208"/>
<text x="393" y="106" class="a">spec files, with</text>
<text x="393" y="120" class="a">media type spec.vN</text>

<!-- the Database and the lockfile store spec nodes, in the spec file version tied to their own -->
<path class="e" d="M110 200v78"/>
<text x="118" y="236" class="a">spec nodes, in the version</text>
<text x="118" y="250" class="a">tied to database.version</text>
<path class="e" d="M660 200v78"/>
<text x="652" y="236" class="a" text-anchor="end">spec nodes, in the version</text>
<text x="652" y="250" class="a" text-anchor="end">tied to _meta.lockfile-version</text>
</svg>
