config:
  install_tree:
    root: {0}
  template_dirs:
  - $spack/share/spack/templates
  - $spack/lib/spack/spack/test/data/templates
  - $spack/lib/spack/spack/test/data/templates_again
  build_stage:
  - $tempdir/$user/spack-stage
  # You can also unset these next two to "solve" the
  # problem: it goes away because in a multi-package
  # install, the installations subprocs won't be
  # trying to simultaneously generate the cache indices
  # at all (for some reason, the test config is not
  # transmitted to the subprocesses on windows)
  source_cache: $user_cache_path/source
  misc_cache: $user_cache_path/cache
  verify_ssl: true
  ssl_certs: $SSL_CERT_FILE
  checksum: true
  dirty: false
  locks: {1}
  concretization_cache:
    enable: false
