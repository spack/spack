enable:
  - tcl
tcl:
  variants: none
  hash_length: 0
  all:
    autoload: direct
    variant_defaults:
      invalid: value
      bool_invalid: true
      debug: true
      build_system: foo
      shared: bad
      fortran: false

  mpileaks@2.3:
    variant_defaults:
      unk: false
      bool_invalid: false
      debug: false
      shared: false
      fortran: true
      opt: bad

  mpich:
    variant_defaults:
      debug: bad

  manyvariants:
    variant_defaults:
      a: true
      b: false
      c: v1
      d: v2

  conditional-variant-pkg@1.0:
    variant_defaults:
      two_whens: true
      version_based: false

  conditional-variant-pkg@2.0:
    variant_defaults:
      two_whens: false
      variant_based: true
