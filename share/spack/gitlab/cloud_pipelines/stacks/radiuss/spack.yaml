spack:
  view: false
  packages:
    all:
      target: [ "x86_64_v3" ]
      require:
      - target=x86_64_v3
      # prefer %gcc@7.5.0 but also allow %gcc@12
      - one_of: ['%gcc@7.5.0', '%gcc@12']

      providers:
        mpi: [mvapich2]

    mfem:
      require:
      # gcc@7.5.0 crashes when building mfem@4.8.0, so use gcc@12
      - '%gcc@12'

  specs:
  - ascent  # ^conduit@0.6.0
  - axom
  - blt
  - caliper
  - care  # ~benchmarks ~examples ~tests
  - chai  # ~examples
  - conduit  # ^hdf5+shared
  - flux-core
  # - flux-sched
  - hypre
  - lbann
  - lvarray ~tests  # per Spack issue #23192  # ~examples
  - mfem
  - py-hatchet
  - py-maestrowf
  - py-merlin
  - py-shroud
  - raja # ~examples  # ~tests
  - raja-perf
  - samrai
  - scr
  - sundials
  - umpire # ~openmp
  # - visit   # ^mesa-glu@9.0.0
  - xbraid
  - zfp

  cdash:
    build-group: RADIUSS
